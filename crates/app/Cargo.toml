[package]
name = "diorama-app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
diorama-core = { path = "../core" }
diorama-renderer = { path = "../renderer" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wgpu = "23"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "MouseEvent",
    "WheelEvent",
    "EventTarget",
    "console",
]
