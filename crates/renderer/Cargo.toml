[package]
name = "diorama-renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
diorama-core = { path = "../core" }
wgpu = "23"
bytemuck = { version = "1", features = ["derive"] }

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement"]

[dev-dependencies]
naga = { version = "23.1", features = ["wgsl-in"] }
serde_json = "1"
