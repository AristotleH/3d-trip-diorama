<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Trip Diorama</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            width: 960px;
            height: 640px;
            border-radius: 8px;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }
    </style>
</head>
<body>
    <canvas id="diorama-canvas" width="960" height="640"></canvas>
    <script type="module" src="index.js"></script>
</body>
</html>
